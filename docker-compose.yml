# Local/demo stack: MongoDB + API + web (nginx). Start with:  docker compose up --build
# Open http://localhost:8080  (demo accounts: see README). Data persists in the "mongo-data" volume.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./server
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/document_manager
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in a .env file next to docker-compose.yml (copy .env.example)}
      CLIENT_URL: http://localhost:${WEB_PORT:-8080}
      PORT: "4000"
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${API_PORT:-4000}:4000"
    # Creates/refreshes the 3 demo users (idempotent; resets their password to the documented demo password), then starts the API.
    command: ["sh", "-c", "node src/seed.js && node src/server.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: ./client
      args:
        VITE_B_URL: /api
        VITE_SHOW_DEMO_ACCOUNTS: "true"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mongo-data:
